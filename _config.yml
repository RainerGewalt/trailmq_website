title: "TrailMQ – MQTT Access Control for Industrial Systems"
description: "Know why MQTT access was allowed or denied. Policy-controlled MQTT for industrial systems, with attributable and reviewable access decisions."

# There is no TrailMQ legal entity and no team. The site is operated by a natural
# person; see docs/legal-findings.md (L3). Do not reintroduce "TrailMQ Team".
author: "Florian Przybylak"
owner_name: "Florian Przybylak"

# Keep these values aligned with the public distribution repository.
product_version: "3.1.1"
product_release_url: "https://github.com/RainerGewalt/TrailMQ/releases/tag/v3.1.1"

# Canonical domain
# Important: use the non-www domain because GitHub Pages is configured with CNAME=trailmq.com
url: "https://trailmq.com"
baseurl: ""

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------
collections:
  wiki_articles:
    output: true
    permalink: /wiki/:path/

# -----------------------------------------------------------------------------
# Defaults
# -----------------------------------------------------------------------------
defaults:
  # Default for wiki articles
  - scope:
      path: ""
      type: "wiki_articles"
    values:
      layout: "wiki-article"
      toc: true

  # Default for normal pages in root
  - scope:
      path: ""
    values:
      layout: default

# -----------------------------------------------------------------------------
# Plugins
# -----------------------------------------------------------------------------
plugins:
  - jekyll-sitemap

# -----------------------------------------------------------------------------
# SEO & Canonical URLs
# -----------------------------------------------------------------------------
# Force trailing slashes for consistency
permalink: pretty

# -----------------------------------------------------------------------------
# Exclude from Jekyll build and sitemap
# -----------------------------------------------------------------------------
exclude:
  - IMPROVEMENTS.md
  - docs
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - .git
  - .gitignore
  - .idea
  - "*.sh"
  - .htaccess
