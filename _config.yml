title: "TrailMQ – MQTT Broker for Auditable, Policy-Controlled Messaging"
description: "Self-hosted MQTT broker with policy enforcement and attributable decision records for regulated, industrial and traceability-sensitive systems."
author: "TrailMQ Team"

# Keep these values aligned with the public distribution repository.
product_version: "3.1.0"
product_release_url: "https://github.com/RainerGewalt/TrailMQ/releases/tag/v3.1.0"

# Canonical domain
# Important: use the non-www domain because GitHub Pages is configured with CNAME=trailmq.com
url: "https://trailmq.com"
baseurl: ""

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------
collections:
  wiki_articles:
    output: true
    permalink: /wiki/:path/

# -----------------------------------------------------------------------------
# Defaults
# -----------------------------------------------------------------------------
defaults:
  # Default for wiki articles
  - scope:
      path: ""
      type: "wiki_articles"
    values:
      layout: "wiki-article"
      toc: true

  # Default for normal pages in root
  - scope:
      path: ""
    values:
      layout: default

# -----------------------------------------------------------------------------
# Plugins
# -----------------------------------------------------------------------------
plugins:
  - jekyll-sitemap

# -----------------------------------------------------------------------------
# SEO & Canonical URLs
# -----------------------------------------------------------------------------
# Force trailing slashes for consistency
permalink: pretty

# -----------------------------------------------------------------------------
# Exclude from Jekyll build and sitemap
# -----------------------------------------------------------------------------
exclude:
  - IMPROVEMENTS.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - .git
  - .gitignore
  - .idea
  - "*.sh"
  - .htaccess
